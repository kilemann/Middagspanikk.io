/* ---------- handleliste ---------- */
function viewShop(){
  const wk = weekKey(weekStart), dates = weekDates(weekStart);
  const st = shopFor(wk);
  const off = new Set(st.off), done = new Set(st.c);
  const days = dates.filter(ds => !off.has(ds));
  const items = buildShop(days);
  const extras = db.extras[wk] || [];
  const all = [...items.map(i => i.key), ...extras.map(x => "x:" + x.id)];
  const nDone = all.filter(k => done.has(k)).length;
  const groups = {};
  for (const it of items) (groups[it.section] = groups[it.section] || []).push(it);
  const itemHtml = (key, label, sub) => {
    const isDone = done.has(key);
    if (shopHide && isDone) return "";
    return `<label class="item${isDone ? " done" : ""}" data-key="${esc(key)}"><input type="checkbox"${isDone ? " checked" : ""}><span class="box"></span><span class="it"><b>${label}</b>${sub ? `<small>${sub}</small>` : ""}</span></label>`;
  };
  const secs = SECTIONS.filter(s => groups[s]).map(s => {
    const list = groups[s].sort((a, b) => a.name.localeCompare(b.name, "no"));
    const left = list.filter(i => !done.has(i.key)).length;
    const rows = list.map(i => itemHtml(i.key, `${esc(fmtQty(i.qty, i.unit))} ${esc(i.name)}`.trim(), esc(i.from.join(", ")))).join("");
    if (!rows) return "";
    return `<section class="card sec"><h3>${SEC_ICON[s]} ${s}<small>${left ? left + " igjen" : "✓"}</small></h3>${rows}</section>`;
  }).join("");
  const extraRows = extras.map(x => {
    const k = "x:" + x.id, isDone = done.has(k);
    if (shopHide && isDone) return "";
    return `<div style="display:flex;align-items:center">${itemHtml(k, esc(x.name), "Lagt til for hånd").replace('class="item', 'style="flex:1" class="item')}<button class="mini eo" data-act="rmExtra" data-id="${x.id}" aria-label="Fjern ${esc(x.name)}">✕</button></div>`;
  }).join("");
  const plannedRecipeDays = dates.filter(ds => db.plan[ds] && recipeById(db.plan[ds].recipeId));
  return `<div class="vhead">
      <div><h1>Handleliste</h1><p class="muted">Laget fra ukeplanen og skalert til antall personer. Avhaking lagres på denne enheten.</p></div>
      ${weekNavHtml()}
    </div>
    <div class="daypick" aria-label="Dager som tas med">
      ${dates.map((ds, i) => { const has = plannedRecipeDays.includes(ds); return `<button data-act="shopDay" data-date="${ds}" class="${has && !off.has(ds) ? "on" : ""}" ${has ? "" : "disabled"} title="${has ? esc(entryView(db.plan[ds]).name) : "Ingen oppskrift"}">${DAY_SHORT[i]}</button>`; }).join("")}
    </div>
    <div class="shop-top">
      <div class="progress" aria-label="${nDone} av ${all.length} kjøpt"><i style="width:${all.length ? nDone / all.length * 100 : 0}%"></i></div>
      <span class="muted" style="font-weight:600">${nDone} av ${all.length} kjøpt</span>
      <button class="btn sm" data-act="shopHide">${shopHide ? "Vis kjøpte" : "Skjul kjøpte"}</button>
      <button class="btn sm" data-act="shopReset" ${nDone ? "" : "disabled"}>Nullstill</button>
      <button class="btn sm" data-act="shopShare" ${all.length ? "" : "disabled"}>📤 Del</button>
    </div>
    ${all.length || canEdit() ? `<div class="secs">${secs}
      <section class="card sec"><h3>🛒 Ekstra varer<small>${extras.length ? extras.filter(x => !done.has("x:" + x.id)).length + " igjen" : ""}</small></h3>
        ${extraRows || '<p class="muted" style="margin:4px 0">Melk, kaffe, dopapir … det som ikke står i oppskriftene.</p>'}
        <form class="extra-form eo" id="exf"><input id="exi" maxlength="60" placeholder="Legg til vare" aria-label="Legg til vare"><button class="btn sm pri" type="submit">Legg til</button></form>
      </section></div>` : `<div class="empty card"><b>🛒</b>Ingen middager med oppskrift denne uka ennå.<br>Planlegg uka først, så fylles listen ut av seg selv.</div>`}`;
}
function shopText(){
  const wk = weekKey(weekStart), dates = weekDates(weekStart), st = shopFor(wk);
  const off = new Set(st.off), done = new Set(st.c);
  const items = buildShop(dates.filter(ds => !off.has(ds))).filter(i => !done.has(i.key));
  const lines = [`Handleliste uke ${isoWeek(weekStart).week}`];
  for (const s of SECTIONS){
    const l = items.filter(i => i.section === s).sort((a, b) => a.name.localeCompare(b.name, "no"));
    if (!l.length) continue;
    lines.push("", s.toUpperCase(), ...l.map(i => `- ${fmtQty(i.qty, i.unit)} ${i.name}`.replace(/- +/, "- ")));
  }
  const ex = (db.extras[wk] || []).filter(x => !done.has("x:" + x.id));
  if (ex.length) lines.push("", "EKSTRA", ...ex.map(x => "- " + x.name));
  return lines.join("\n");
}
async function shareShop(){
  const text = shopText();
  try{
    if (navigator.share){ await navigator.share({ title: "Handleliste", text }); return; }
  }catch(e){ if (e.name === "AbortError") return; }
  try{ await navigator.clipboard.writeText(text); toast("📋 Handlelisten er kopiert"); }
  catch(e){ toast("Klarte ikke å kopiere"); }
}

/* ---------- statistikk ---------- */
function viewStats(){
  const t = todayStr(), now = new Date();
  const start = statsPeriod === "3m" ? ymd(new Date(now.getFullYear(), now.getMonth() - 2, 1))
    : statsPeriod === "12m" ? ymd(new Date(now.getFullYear(), now.getMonth() - 11, 1)) : "0000";
  const entries = Object.entries(db.plan).filter(([k]) => k >= start && k <= t).map(([k, e]) => ({ date: k, ...entryView(e) }));
  const periodChips = `<div class="chips">${[["3m", "Siste 3 måneder"], ["12m", "Siste 12 måneder"], ["all", "Alt"]].map(([k, l]) => `<button class="chip${statsPeriod === k ? " on" : ""}" data-act="period" data-p="${k}">${l}</button>`).join("")}</div>`;
  const head = `<div class="vhead"><div><h1>Statistikk</h1><p class="muted">Middager som er spist (planlagt til og med i dag).</p></div></div>${periodChips}`;
  if (!entries.length) return head + `<div class="empty card" style="margin-top:12px"><b>📊</b>Ingen middager i perioden ennå.<br>Statistikken fylles ut etter hvert som dere planlegger og spiser.</div>`;

  // mest brukte
  const cnt = new Map();
  for (const e of entries){ const k = e.recipeId && e.recipe ? e.recipeId : "t:" + e.name.toLowerCase(); const c = cnt.get(k) || { name: e.name, cat: e.category, n: 0 }; c.n++; cnt.set(k, c); }
  const top = [...cnt.values()].sort((a, b) => b.n - a.n || a.name.localeCompare(b.name, "no")).slice(0, 8);
  const maxTop = top[0].n;
  const topHtml = top.map(x => `<div class="hbar"><span class="nm">${x.cat ? catIcon(x.cat) : "📝"} ${esc(x.name)}</span><span class="tr"><i style="width:${x.n / maxTop * 100}%;--c:${catColor(x.cat)}"></i></span><span class="v">${x.n}</span></div>`).join("");

  // fisk per måned (12 siste måneder, eller færre for kort periode)
  const months = statsPeriod === "3m" ? 3 : 12;
  const fish = Array.from({ length: months }, (_, i) => { const d = new Date(now.getFullYear(), now.getMonth() - (months - 1 - i), 1); return { y: d.getFullYear(), m: d.getMonth(), n: 0 }; });
  for (const e of entries) if (e.category === "Fisk"){ const d = parseYmd(e.date); const f = fish.find(x => x.y === d.getFullYear() && x.m === d.getMonth()); if (f) f.n++; }
  const maxFish = Math.max(1, ...fish.map(x => x.n));
  const fishTotal = fish.reduce((a, x) => a + x.n, 0);
  const fishHtml = `<div class="vbars">${fish.map(x => `<div class="col"><em>${x.n || ""}</em><i style="height:${x.n / maxFish * 100}%;--c:${catColor("Fisk")}"></i><small>${MONTHS[x.m]}</small></div>`).join("")}</div>`;

  // hverdagsmat vs helgekos
  const withCat = entries.filter(e => e.recipe || e.category);
  const kos = withCat.filter(isKos).length, hverdag = withCat.length - kos;
  const pct = withCat.length ? Math.round(kos / withCat.length * 100) : 0;
  const cK = catColor("Helgekos"), cH = catColor("Hverdagsmiddag");
  const donut = `<div class="donut"><div class="ring" style="background:conic-gradient(${cK} 0 ${pct}%, ${cH} ${pct}% 100%)"><b>${pct}%<small>helgekos</small></b></div>
    <div class="legend"><div><span class="dot" style="--c:${cH}"></span>Hverdagsmat <b style="margin-left:auto;padding-left:12px">${hverdag}</b></div><div><span class="dot" style="--c:${cK}"></span>Helgekos <b style="margin-left:auto;padding-left:12px">${kos}</b></div>
    <small class="muted">Helgekos = kategori Helgekos eller Grill, eller over 45 min.</small></div></div>`;

  // kategorier
  const cats = CATS.map(c => ({ c, n: entries.filter(e => e.category === c).length })).filter(x => x.n).sort((a, b) => b.n - a.n);
  const maxC = Math.max(1, ...cats.map(x => x.n));
  const catHtml = cats.map(x => `<div class="hbar"><span class="nm">${catIcon(x.c)} ${x.c}</span><span class="tr"><i style="width:${x.n / maxC * 100}%;--c:${catColor(x.c)}"></i></span><span class="v">${x.n}</span></div>`).join("");

  const wkdays = entries.filter(e => weekdayIdx(parseYmd(e.date)) < 5 && e.recipe);
  const avg = wkdays.length ? Math.round(wkdays.reduce((a, e) => a + e.time, 0) / wkdays.length) : 0;
  const distinct = cnt.size;
  const favShare = entries.length ? Math.round(entries.filter(e => e.recipe && e.recipe.favorite).length / entries.length * 100) : 0;
  return head + `
    <div class="kpis" style="margin-top:8px">
      <div class="card kpi"><b>${entries.length}</b><span>middager</span></div>
      <div class="card kpi"><b>${distinct}</b><span>ulike retter</span></div>
      <div class="card kpi"><b>${avg ? avg + " min" : "–"}</b><span>snittid på hverdager</span></div>
      <div class="card kpi"><b>${favShare}%</b><span>var favoritter</span></div>
    </div>
    <div class="stats">
      <section class="card"><h3>🏆 Mest brukte middager</h3>${topHtml}</section>
      <section class="card"><h3>⚖️ Hverdagsmat og helgekos</h3>${donut}</section>
      <section class="card"><h3>🐟 Fiskemiddager per måned <span class="muted" style="font-weight:500">· ${fishTotal} totalt</span></h3>${fishHtml}</section>
      <section class="card"><h3>🍽️ Kategorier</h3>${catHtml || '<p class="muted">Ingen data.</p>'}</section>
    </div>`;
}

/* ---------- meny, tema, eksport/import ---------- */
function applyTheme(){
  const t = ls.get(THEME_KEY) || "";
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  const dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  $("#themeBtn").textContent = dark ? "☀️" : "🌙";
  $("#themeBtn").setAttribute("aria-label", dark ? "Bytt til lyst tema" : "Bytt til mørkt tema");
  $('meta[name="theme-color"]').setAttribute("content", dark ? "#16130f" : "#f7f3ec");
}
function toggleTheme(){
  const t = ls.get(THEME_KEY) || "";
  const dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  ls.set(THEME_KEY, dark ? "light" : "dark"); applyTheme();
}
function menuForm(){
  openModal(`<button class="mclose" data-close aria-label="Lukk">✕</button>
    <h2>Meny</h2>
    <div class="lbl-row"><b>Tema</b><div class="seg" id="th"><button data-t="light">☀️ Lyst</button><button data-t="dark">🌙 Mørkt</button><button data-t="">📱 Auto</button></div></div>
    <div class="lbl-row eo"><b>Standard antall personer</b><div class="seg" id="dp"><button data-p="3">3</button><button data-p="4">4</button></div></div>
    <div class="menu-list">
      <button class="btn" id="exp">⬇️ Eksporter data (JSON)</button>
      <button class="btn eo" id="imp">⬆️ Importer data (JSON)</button>
      <button class="btn" id="lk">${canEdit() ? "🔒 Lås redigering på denne enheten" : "🔓 Lås opp redigering"}</button>
      <button class="btn eo" id="bml">📥 Hent oppskrifter fra nettsider</button>
      <a class="btn" href="https://github.com/${GH.owner}/${GH.repo}/blob/${GH.branch}/CHANGELOG.md" target="_blank" rel="noopener">📝 Endringslogg</a>
    </div>
    <input type="file" id="impf" accept="application/json,.json" hidden>
    <p class="ver">${APP_NAME} v${APP_VERSION} · ${db.recipes.length} retter · ${Object.keys(db.plan).length} planlagte dager</p>`,
  (m, close) => {
    const drawT = () => { const cur = ls.get(THEME_KEY) || ""; $$("#th button", m).forEach(b => b.classList.toggle("on", b.dataset.t === cur)); };
    drawT();
    $("#th", m).onclick = e => { const b = e.target.closest("button"); if (!b) return; ls.set(THEME_KEY, b.dataset.t); if (!b.dataset.t) ls.del(THEME_KEY); applyTheme(); drawT(); };
    const drawP = () => $$("#dp button", m).forEach(b => b.classList.toggle("on", +b.dataset.p === db.settings.persons));
    drawP();
    $("#dp", m).onclick = e => { const b = e.target.closest("button"); if (!b) return; db.settings.persons = +b.dataset.p; save(); drawP(); };
    $("#exp", m).onclick = () => exportData();
    $("#bml", m).onclick = () => { close(); bookmarkletForm(); };
    $("#imp", m).onclick = () => $("#impf", m).click();
    $("#impf", m).onchange = e => { const f = e.target.files[0]; if (f){ close(); importData(f); } };
    $("#lk", m).onclick = async () => {
      close();
      if (!canEdit()) return unlockForm();
      if (sync.dirty) await pushNow();
      lockOut("🔒 Redigering er låst på denne enheten");
    };
  });
}
function exportData(){
  const blob = new Blob([fileText(db)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `middagspanikk-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast("⬇️ Data er eksportert");
}
async function importData(file){
  if (!canEdit()) return toast("Lås opp redigering først");
  let data;
  try{ data = validate(JSON.parse(await file.text())); }
  catch(e){ return toast("Kunne ikke lese filen: " + (e.message || "ugyldig JSON")); }
  const ok = await confirmBox("Importere data?", `Filen har ${data.recipes.length} retter og ${Object.keys(data.plan).length} planlagte dager. Alt nåværende innhold erstattes. En kopi tas vare på denne enheten først.`, "Importer", true);
  if (!ok) return;
  ls.set(BACKUP_KEY, JSON.stringify({ date: new Date().toISOString(), app: APP_VERSION, data: db }));
  const before = db;
  db = data; save(); refresh();
  toast("⬆️ Data er importert", () => { db = before; save(); refresh(); });
}

/* ---------- modal og toast ---------- */
let modalClose = null;
function openModal(html, onMount, cls = ""){
  if (modalClose) modalClose();
  const wrap = document.createElement("div");
  wrap.id = "modal"; wrap.className = "modal-wrap";
  wrap.innerHTML = `<div class="modal ${cls}" role="dialog" aria-modal="true" tabindex="-1">${html}</div>`;
  const dlg = wrap.firstElementChild;
  const h = $("h2", dlg);
  if (h){ h.id = "mtitle"; dlg.setAttribute("aria-labelledby", "mtitle"); } else dlg.setAttribute("aria-label", APP_NAME);
  const prev = document.activeElement;
  document.body.appendChild(wrap); document.body.classList.add("noscroll");
  const bg = ["header.top", "#main", "#bottom"].map(q => $(q)).filter(Boolean);
  bg.forEach(el => el.inert = true);
  let dirty = false;
  dlg.addEventListener("input", () => { dirty = true; });
  const focusables = () => [...dlg.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(el => el.offsetParent !== null || el === document.activeElement);
  const onKey = e => {
    if (e.key === "Escape"){ close(); return; }
    if (e.key !== "Tab") return;
    const f = focusables();
    if (!f.length){ e.preventDefault(); dlg.focus(); return; }
    const first = f[0], last = f[f.length - 1], a = document.activeElement;
    if (e.shiftKey && (a === first || a === dlg)){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && a === last){ e.preventDefault(); first.focus(); }
    else if (!dlg.contains(a)){ e.preventDefault(); first.focus(); }
  };
  const close = () => {
    if (!wrap.isConnected) return;
    wrap.remove(); document.body.classList.remove("noscroll");
    bg.forEach(el => el.inert = false);
    document.removeEventListener("keydown", onKey);
    if (modalClose === close) modalClose = null;
    if (prev && prev.focus && prev.isConnected) prev.focus({ preventScroll: true });
  };
  document.addEventListener("keydown", onKey);
  wrap.addEventListener("click", e => {
    if (e.target.closest("[data-close]")) close();
    else if (e.target === wrap){
      if (dirty && dlg.querySelector("form")) toast("Trykk «Avbryt» for å lukke uten å lagre");
      else close();
    }
  });
  modalClose = close;
  if (onMount) onMount(dlg, close);
  const f = $("[autofocus]", wrap);
  if (f && matchMedia("(min-width:700px)").matches) setTimeout(() => f.focus(), 40);
  else dlg.focus({ preventScroll: true });
  return close;
}
function confirmBox(title, text, okText = "Slett", danger = true, cancelText = "Avbryt"){
  return new Promise(res => {
    let done = false;
    const finish = v => { if (!done){ done = true; res(v); } };
    openModal(`<h2>${esc(title)}</h2><p class="muted">${esc(text)}</p>
      <div class="acts"><button class="btn" id="cn">${esc(cancelText)}</button><button class="btn ${danger ? "danger" : "pri"}" id="cy">${esc(okText)}</button></div>`,
    (m, close) => {
      $("#cn", m).onclick = () => { finish(false); close(); };
      $("#cy", m).onclick = () => { finish(true); close(); };
      new MutationObserver((_, o) => { if (!m.isConnected){ o.disconnect(); finish(false); } }).observe(document.body, { childList: true });
    });
  });
}
function toast(msg, undo){
  const box = $("#toasts"); if (!box) return;
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button">Angre</button>' : ""}`;
  box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();
  const t = setTimeout(() => el.remove(), undo ? 6000 : 3000);
  if (undo) el.querySelector("button").onclick = () => { clearTimeout(t); el.remove(); undo(); };
}

/* ---------- hendelser ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.closest("#modal")) return;
  const act = b.dataset.act, ds = b.dataset.date, id = b.dataset.id;
  switch (act){
    case "week": {
      const d = +b.dataset.d;
      weekStart = d === 0 ? mondayOf(new Date()) : addDays(weekStart, 7 * d);
      refresh(); break;
    }
    case "openDay": {
      if (canEdit()) dayForm(ds);
      else { const e2 = db.plan[ds]; if (e2 && recipeById(e2.recipeId)) recipeDetail(e2.recipeId); }
      break;
    }
    case "persons": {
      if (!canEdit()) break;
      const e2 = db.plan[ds]; if (!e2) break;
      e2.persons = e2.persons === 4 ? 3 : 4; save(); refresh(); break;
    }
    case "reroll": reroll(ds); break;
    case "clearDay": clearDay(ds); break;
    case "propose": proposeForm(); break;
    case "recipe": {
      if (e.target.closest(".star")) break;
      recipeDetail(id); break;
    }
    case "fav": e.stopPropagation(); toggleFav(id); drawGrid(); break;
    case "newRecipe": recipeForm(); break;
    case "bookmarklet": bookmarkletForm(); break;
    case "shopDay": {
      const wk = weekKey(weekStart), st = shopFor(wk);
      st.off = st.off.includes(ds) ? st.off.filter(x => x !== ds) : [...st.off, ds];
      setShopFor(wk, st); refresh(); break;
    }
    case "shopHide": shopHide = !shopHide; refresh(); break;
    case "shopReset": { const wk = weekKey(weekStart), st = shopFor(wk), old = st.c; st.c = []; setShopFor(wk, st); refresh(); toast("Avhakingene er nullstilt", () => { st.c = old; setShopFor(wk, st); refresh(); }); break; }
    case "shopShare": shareShop(); break;
    case "rmExtra": {
      const wk = weekKey(weekStart), list = db.extras[wk] || [];
      const i = list.findIndex(x => x.id === id); if (i < 0) break;
      const [old] = list.splice(i, 1); if (!list.length) delete db.extras[wk];
      save(); refresh();
      toast(`Fjernet ${old.name}`, () => { (db.extras[wk] = db.extras[wk] || []).splice(i, 0, old); save(); refresh(); });
      break;
    }
    case "period": statsPeriod = b.dataset.p; refresh(); break;
    case "theme": toggleTheme(); break;
    case "menu": menuForm(); break;
    case "lock": if (canEdit()) menuForm(); else unlockForm(); break;
    case "saveNow": pushNow(); break;
    case "retrySync": pushNow(); break;
  }
});
/* avhaking i handlelisten (label + skjult checkbox) */
document.addEventListener("change", e => {
  const item = e.target.closest(".item"); if (!item || e.target.type !== "checkbox") return;
  const wk = weekKey(weekStart), st = shopFor(wk), k = item.dataset.key;
  st.c = e.target.checked ? [...new Set([...st.c, k])] : st.c.filter(x => x !== k);
  setShopFor(wk, st); refresh();
});
document.addEventListener("submit", e => {
  if (e.target.id !== "exf") return;
  e.preventDefault();
  const inp = $("#exi"), name = inp.value.trim(); if (!name || !canEdit()) return;
  const wk = weekKey(weekStart);
  (db.extras[wk] = db.extras[wk] || []).push({ id: uid(), name });
  save(); refresh();
  const again = $("#exi"); if (again) again.focus();
});
/* søk og filter i oppskrifter/favoritter – tegner bare rutenettet, så søkefeltet beholder fokus */
document.addEventListener("input", e => {
  if (e.target.id !== "q" || e.target.closest("#modal")) return;

});
document.addEventListener("change", e => {

  rf.sort = e.target.value; drawGrid();
});
document.addEventListener("click", e => {

  $$("#cats .chip").forEach(x => x.classList.toggle("on", "fav" in x.dataset ? f.fav : x.dataset.cat === f.cat));
  drawGrid();
});
addEventListener("hashchange", route);
addEventListener("storage", e => {
  if (e.key === TOKEN_KEY){ token = ls.get(TOKEN_KEY) || ""; drawLock(); refresh(); }
  if (e.key === SHOP_KEY && view === "handleliste") refresh();
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && sync.dirty && canEdit()) pushNow(); });
addEventListener("beforeunload", e => { if (sync.dirty && canEdit()) { pushNow(); e.preventDefault(); e.returnValue = ""; } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);

applyTheme();
takeImportFromHash();
{ const h = (location.hash.replace(/^#\/?/, "").split("/")[0] || "uke"); view = VIEWS.some(v => v[0] === h) ? h : "uke"; }
