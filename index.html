<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'self' https://api.github.com; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Middags panikk™</title>
<meta name="theme-color" content="#f7f3ec">
<meta name="description" content="Middagsplanlegger for familien Kile: ukeplan, oppskrifter, handleliste og statistikk.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23d1552f'/%3E%3Ccircle cx='32' cy='33' r='15' fill='%23fff'/%3E%3Ccircle cx='32' cy='33' r='10' fill='none' stroke='%23d1552f' stroke-width='2' opacity='.45'/%3E%3Cpath d='M10 15v10a3 3 0 0 0 3 3v20M13 15v9M16 15v10a3 3 0 0 1-3 3' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' fill='none'/%3E%3Cpath d='M51 48V15c-3 2-4 7-4 13h4' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* Middags panikk™ v1.1.1 – se CHANGELOG.md */
:root{
  --bg:#f7f3ec; --bg2:#efe7da; --card:#fffdf9; --card2:#f5efe5; --line:#e7dccb; --line2:#d6c7af;
  --ink:#2a231c; --muted:#6a5e50; --dim:#76695a;
  --accent:#b3421e; --accent-ink:#fff; --accent-soft:#fbe4d9; --green:#3b7237; --green-soft:#e2efdd;
  --star:#9c6c00; --star-bg:#dc9b00; --danger:#c0392b; --today:#b3421e;
  --shadow:0 1px 2px rgba(70,45,20,.06),0 8px 24px rgba(70,45,20,.07);
  --r:18px; --r2:12px;
  --head:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --nav-h:64px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#16130f; --bg2:#1d1914; --card:#221e18; --card2:#2a251e; --line:#372f26; --line2:#4a3f33;
  --ink:#f3ece2; --muted:#b5a794; --dim:#9a8d7c;
  --accent:#ef7b52; --accent-ink:#1d0f08; --accent-soft:#3c2318; --green:#86c47f; --green-soft:#1f2d1c;
  --star:#f4c24f; --star-bg:#f4c24f; --danger:#f0705f; --today:#ef7b52;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16130f; --bg2:#1d1914; --card:#221e18; --card2:#2a251e; --line:#372f26; --line2:#4a3f33;
    --ink:#f3ece2; --muted:#b5a794; --dim:#9a8d7c;
    --accent:#ef7b52; --accent-ink:#1d0f08; --accent-soft:#3c2318; --green:#86c47f; --green-soft:#1f2d1c;
    --star:#f4c24f; --star-bg:#f4c24f; --danger:#f0705f; --today:#ef7b52;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);min-height:100vh;overflow-x:hidden}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--head);letter-spacing:-.01em;margin:0}
h1{font-size:1.6rem;font-weight:800}
h2{font-size:1.25rem;font-weight:800}
h3{font-size:1rem;font-weight:700}
.muted{color:var(--muted)}
.ro .eo{display:none!important}

/* ---------- ramme ---------- */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:44px}
.brand{display:flex;align-items:center;gap:10px;font:800 1.2rem var(--head);text-decoration:none;color:var(--ink);flex:none}
.brand svg{width:34px;height:34px;flex:none}
.brand sup{font-size:.55em;margin-left:1px}
.tabs{display:none;gap:4px;margin:0 auto}
.tab{border:0;background:none;padding:8px 14px;border-radius:999px;color:var(--muted);font-weight:600;text-decoration:none;display:flex;align-items:center;gap:7px}
.tab svg{width:18px;height:18px}
.tab:hover{color:var(--ink);background:var(--card2)}
.tab.on{color:var(--accent-ink);background:var(--accent)}
.right{display:flex;align-items:center;gap:6px;margin-left:auto}
#lockTop{display:flex;align-items:center;gap:6px}
.brand{min-width:0}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:1.05rem}
.iconbtn:hover{border-color:var(--line2)}
.lockbtn,.sync,.savebtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 12px;font-size:.82rem;font-weight:600;white-space:nowrap}
.lockbtn.on{border-color:var(--green);color:var(--green)}
.sync{border-color:transparent;background:none;color:var(--muted)}
.sync.ok{color:var(--green)}
.sync.err{color:var(--danger);border-color:var(--danger);background:var(--card)}
.savebtn{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main{max-width:1280px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bottom{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;height:var(--nav-h);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px;border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.navbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:16px;color:var(--muted);
  font-size:.68rem;font-weight:700;text-decoration:none}
.navbtn svg{width:22px;height:22px}
.navbtn.on{color:var(--accent);background:var(--accent-soft)}
@media (min-width:900px){
  .tabs{display:flex}
  .bottom{display:none}
  main{padding-bottom:48px}
}
@media (max-width:520px){ .lockbtn .lbl,.savebtn .lbl,.sync .lbl{display:none} .brand span{font-size:1.05rem} .top-in{gap:8px} .right{gap:5px} }
@media (max-width:359px){ .brand span{display:none} }
@media (min-width:1100px){ .mini{width:34px;height:34px} }

/* ---------- felles ---------- */
.vhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.vhead p{margin:4px 0 0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 15px;font-weight:600;display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--line2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:9px 12px;font-size:.85rem;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 14px;font-size:.85rem;font-weight:600;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.fav.on{background:var(--star-bg);border-color:var(--star-bg);color:#2a1d00}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--dim));flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:.75rem;font-weight:700;background:var(--card2);color:var(--muted)}
.pill.fast{background:var(--green-soft);color:var(--green)}
.search{position:relative;flex:1;min-width:200px}
.search input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px 10px 38px}
.search svg{position:absolute;left:12px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--dim)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty b{display:block;font-size:2rem;margin-bottom:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:8px 16px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}

/* ---------- ukeplan ---------- */
.weeknav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.weeknav .wk{font-weight:700;min-width:170px;text-align:center}
.weeknav .wk small{display:block;font-weight:500;color:var(--muted);font-size:.8rem}
.days{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:640px){ .days{grid-template-columns:repeat(2,1fr)} }
@media (min-width:1100px){ .days{grid-template-columns:repeat(7,1fr)} }
.day{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
@media (min-width:1100px){ .day{min-height:190px} }
.day.weekend{background:linear-gradient(180deg,var(--card),var(--card2))}
.day.today{border-color:var(--today);box-shadow:0 0 0 1px var(--today),var(--shadow)}
.day.past{background:var(--card2)}
.day.past .mi{opacity:.55;filter:grayscale(.6)}
.day header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.day .dn{font:800 1rem var(--head)}
.day .dd{font-size:.8rem;color:var(--muted)}
.day .now{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--today)}
.meal{flex:1;display:flex;align-items:center;gap:12px;text-align:left;border:0;background:none;padding:0;border-radius:10px}
.meal .mi{font-size:1.6rem;line-height:1;width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:13px;background:color-mix(in srgb,var(--c) 15%,var(--card))}
.meal .mt{display:flex;flex-direction:column;gap:3px;min-width:0}
@media (min-width:1100px){ .meal{flex-direction:column;align-items:flex-start;gap:8px} }
.meal b{font:700 1.02rem/1.25 var(--head)}
.add{flex:1;display:grid;place-items:center;border:1.5px dashed var(--line2);border-radius:12px;background:none;color:var(--muted);font-weight:600;min-height:56px}
.add:hover{color:var(--accent);border-color:var(--accent)}
.noplan{flex:1;display:grid;place-items:center;color:var(--dim);font-size:.9rem}
.day footer{display:flex;align-items:center;gap:6px;margin-top:10px}
.pp{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:8px 12px;min-height:38px;font-size:.8rem;font-weight:700}
.pp.four{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.mini{width:40px;height:40px;border-radius:9px;border:1px solid transparent;background:none;display:grid;place-items:center;color:var(--muted)}
.mini:hover{background:var(--card2);border-color:var(--line)}
.day footer .sp{flex:1}
.summary{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.summary .card{padding:12px 16px;display:flex;align-items:center;gap:10px;flex:1;min-width:200px}
.summary .big{font:800 1.4rem var(--head)}

/* ---------- oppskrifter ---------- */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.tools select{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));margin-top:6px}
.rc{position:relative;border-radius:var(--r);border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);width:100%}
.rcmain{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border:0;background:none;border-radius:var(--r);width:100%;color:inherit;font:inherit}
.rc:hover{border-color:var(--line2)}
.ricon{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:1.45rem;background:color-mix(in srgb,var(--c) 16%,var(--card))}
.rc .rb{flex:1;min-width:0}
.rc b{display:block;font:700 1.02rem/1.25 var(--head);padding-right:40px}
.rc .rd{display:-webkit-box;margin:3px 0 7px;color:var(--muted);font-size:.86rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rc .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.star{position:absolute;top:6px;right:6px;width:40px;height:40px;border-radius:10px;border:0;background:none;font-size:1.15rem;color:var(--dim);display:grid;place-items:center}
.star.on{color:var(--star)}
.ro .star:not(.on){display:none}
.count{font-size:.85rem;color:var(--muted);margin-left:auto}

/* ---------- handleliste ---------- */
.shop-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.progress{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;flex:1;min-width:140px}
.progress i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.daypick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.daypick button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px;font-size:.82rem;font-weight:700;color:var(--muted);min-width:46px}
.daypick button.on{background:var(--green-soft);color:var(--green);border-color:var(--green)}
.daypick button:disabled{opacity:.35;cursor:default}
.secs{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));align-items:start}
.sec{padding:12px 14px}
.sec h3{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:.95rem}
.sec h3 small{margin-left:auto;color:var(--muted);font-weight:600}
.item{display:flex;align-items:center;gap:12px;padding:8px 2px;border-top:1px solid var(--line);cursor:pointer;user-select:none}
.item:first-of-type{border-top:0}
.item input{position:absolute;opacity:0;pointer-events:none}
.item input:focus-visible + .box{outline:2px solid var(--accent);outline-offset:2px}
.modal:focus{outline:none}
.box{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--line2);display:grid;place-items:center;transition:.15s}
.item.done .box{background:var(--green);border-color:var(--green)}
.item.done .box::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.item .it{flex:1;min-width:0}
.item .it b{font-weight:600}
.item .it small{display:block;color:var(--dim);font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.done .it{opacity:.5;text-decoration:line-through}
.extra-form{display:flex;gap:8px;margin-top:8px}
.extra-form input{flex:1;border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:8px 10px;min-width:0}

/* ---------- statistikk ---------- */
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));align-items:start}
.stats .card{padding:16px}
.stats h3{margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:12px}
.kpi{padding:14px 16px}
.kpi b{display:block;font:800 1.7rem var(--head)}
.kpi span{color:var(--muted);font-size:.85rem}
.hbar{display:grid;grid-template-columns:minmax(90px,38%) 1fr 34px;gap:10px;align-items:center;margin:7px 0;font-size:.88rem}
.hbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .tr{height:12px;background:var(--card2);border-radius:99px;overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:99px;background:var(--c,var(--accent))}
.hbar .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.vbars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:18px}
.vbars .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.vbars .col i{display:block;width:100%;max-width:30px;border-radius:7px 7px 3px 3px;background:var(--c,#2f7fb5);min-height:3px}
.vbars .col em{font-style:normal;font-size:.75rem;font-weight:700;font-variant-numeric:tabular-nums}
.vbars .col small{font-size:.68rem;color:var(--muted)}
.donut{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut .ring{width:130px;height:130px;border-radius:50%;flex:none;display:grid;place-items:center;position:relative}
.donut .ring::after{content:"";position:absolute;inset:22px;border-radius:50%;background:var(--card)}
.donut .ring b{position:relative;z-index:1;font:800 1.3rem var(--head);text-align:center;line-height:1.1}
.donut .ring b small{display:block;font:600 .7rem var(--body);color:var(--muted)}
.legend{display:grid;gap:8px;font-size:.9rem}
.legend div{display:flex;align-items:center;gap:8px}
.legend .dot{width:12px;height:12px;border-radius:4px}

/* ---------- modal ---------- */
.modal-wrap{position:fixed;inset:0;z-index:50;background:rgba(20,14,8,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.modal{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:up .2s ease-out}
@media (min-width:700px){ .modal-wrap{align-items:center;padding:20px} .modal{border-radius:22px;max-height:88vh} }
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
.modal.wide{max-width:780px}
.modal h2{margin-bottom:6px;padding-right:36px}
.mclose{position:sticky;top:0;float:right;margin:-6px -6px 0 0;width:40px;height:40px;border-radius:50%;border:0;background:var(--card2);font-size:1.1rem;z-index:2}
.acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:18px}
.acts .grow{margin-right:auto}
.form{display:grid;gap:12px;grid-template-columns:1fr 1fr;margin-top:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:.82rem;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea,.ing input,.ing select,.freetext input{border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
.field textarea{min-height:70px;resize:vertical}
.check{display:flex;align-items:center;gap:8px;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.ings{display:grid;gap:8px}
.ing{display:grid;grid-template-columns:70px 82px 1fr 40px;gap:6px;align-items:center}
.ing .sec-sel{grid-column:1/4}
.ing .x{border:0;background:none;color:var(--dim);font-size:1.1rem;height:40px}
@media (min-width:560px){ .ing{grid-template-columns:72px 84px 1fr 150px 40px} .ing .sec-sel{grid-column:auto} }
.ing-head{display:none;font-size:.74rem;font-weight:700;color:var(--dim);grid-template-columns:72px 84px 1fr 150px 40px;gap:6px}
@media (min-width:560px){ .ing-head{display:grid} }
.detail-meta{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.ilist{list-style:none;padding:0;margin:8px 0 0;columns:2;column-gap:20px}
@media (max-width:480px){ .ilist{columns:1} }
.ilist li{padding:5px 0;border-bottom:1px dashed var(--line);break-inside:avoid;display:flex;gap:8px}
.ilist li span{color:var(--muted);min-width:68px;font-variant-numeric:tabular-nums}
.pick-list{display:grid;gap:6px;max-height:44vh;overflow:auto;margin-top:10px;padding-right:2px}

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
const mondayOf = d => addDays(d, -((d.getDay() + 6) % 7));
const weekdayIdx = d => (d.getDay() + 6) % 7;   // 0 = mandag
const todayStr = () => ymd(new Date());
const weekDates = mon => Array.from({ length: 7 }, (_, i) => ymd(addDays(mon, i)));
function isoWeek(d){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return { year: t.getUTCFullYear(), week: Math.ceil(((t - y0) / 864e5 + 1) / 7) };
}
const weekKey = mon => { const w = isoWeek(mon); return `${w.year}-W${pad(w.week)}`; };
const fmtShort = d => `${d.getDate()}. ${MONTHS[d.getMonth()]}`;
const num = n => String(+(+n).toFixed(2)).replace(".", ",");
const parseNum = s => { const n = parseFloat(String(s).replace(",", ".")); return isFinite(n) ? n : 0; };
const clampInt = (v, lo, hi, def) => { const n = Math.round(Number(v)); return isFinite(n) && n >= lo && n <= hi ? n : def; };

/* ---------- datamodell ---------- */
function parseIng(s){
  const m = String(s).trim().match(/^([\d.,]+)\s+(\S+)\s+(.+?)\s+#(\w)$/);
  if (!m) return { qty: 0, unit: "stk", name: String(s).trim(), section: "Annet" };
  return { qty: parseNum(m[1]), unit: m[2], name: m[3], section: SEC_CODE[m[4]] || "Annet" };
}
function seed(){
  return {
    settings: { persons: 3 },
    recipes: SEED.map(([name, desc, time, category, fav, ings], i) => ({
      id: "r" + pad(i + 1), name, desc, time, category, servings: 4, favorite: !!fav,
      ingredients: ings.split(";").map(parseIng),
    })),
    plan: {},
    extras: {},
  };
}
function cleanIng(g){
  return {
    qty: Math.max(0, parseNum(g && g.qty)),
    unit: UNITS.includes(g && g.unit) ? g.unit : "stk",
    name: String((g && g.name) || "").trim(),
    section: SECTIONS.includes(g && g.section) ? g.section : "Annet",
  };
}
function cleanRecipe(r){
  return {
    id: String(r.id || uid()),
    name: String(r.name).trim(),
    desc: String(r.desc || "").trim(),
    time: clampInt(r.time, 1, 1440, 30),
    category: CATS.includes(r.category) ? r.category : "Hverdagsmiddag",
    servings: clampInt(r.servings, 1, 20, 4),
    favorite: !!r.favorite,
    url: /^https?:\/\/\S+$/i.test(String(r.url || "").trim()) ? String(r.url).trim().slice(0, 500) : "",
    ingredients: (Array.isArray(r.ingredients) ? r.ingredients : []).map(cleanIng).filter(g => g.name),
  };
}
function validate(d){
  if (!d || typeof d !== "object" || !Array.isArray(d.recipes)) throw new Error("Filen er ikke data fra Middags panikk.");
  const recipes = d.recipes.filter(r => r && String(r.name || "").trim()).map(cleanRecipe);
  const plan = {};
  for (const [k, v] of Object.entries(d.plan && typeof d.plan === "object" ? d.plan : {})) {
    if (!/^\d{4}-\d\d-\d\d$/.test(k) || !v || !String(v.name || "").trim()) continue;
    plan[k] = { recipeId: String(v.recipeId || ""), name: String(v.name).trim(), category: CATS.includes(v.category) ? v.category : "",
      time: clampInt(v.time, 0, 1440, 0), persons: Number(v.persons) === 4 ? 4 : 3 };
  }
  const extras = {};
  for (const [k, v] of Object.entries(d.extras && typeof d.extras === "object" ? d.extras : {})) {
    if (!/^\d{4}-W\d\d$/.test(k) || !Array.isArray(v)) continue;
    const list = v.filter(x => x && String(x.name || "").trim()).map(x => ({ id: String(x.id || uid()), name: String(x.name).trim() }));
    if (list.length) extras[k] = list;
  }
  return { settings: { persons: Number(d.settings && d.settings.persons) === 4 ? 4 : 3 }, recipes, plan, extras };
}
const fileText = d => JSON.stringify({ app: APP_NAME, appVersion: APP_VERSION, updated: new Date().toISOString(), version: 1,
  settings: d.settings, recipes: d.recipes, plan: d.plan, extras: d.extras }, null, 2) + "\n";

let db = { settings: { persons: 3 }, recipes: [], plan: {}, extras: {} };

/* ---------- lagring på enheten ---------- */
const ls = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k, v){ try{ localStorage.setItem(k, v); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} },
};
let token = ls.get(TOKEN_KEY) || "";
const canEdit = () => !!token;
let sync = (() => { try{ return JSON.parse(ls.get(SYNC_KEY) || "{}") || {}; }catch(e){ return {}; } })();
const saveSync = () => ls.set(SYNC_KEY, JSON.stringify(sync));
let loadState = "loading", loadError = "", syncState = "", syncMsg = "", changeNo = 0;
function readCache(){ try{ const raw = ls.get(CACHE_KEY); return raw ? validate(JSON.parse(raw)) : null; }catch(e){ return null; } }
function writeCache(){ if (!ls.set(CACHE_KEY, JSON.stringify(db))) toast("Klarte ikke å lagre på enheten (fullt lager?)"); }

/* ---------- GitHub ---------- */
const API = `https://api.github.com/repos/${GH.owner}/${GH.repo}`;
function ghHeaders(t = token){ const h = { Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" }; if (t) h.Authorization = "Bearer " + t; return h; }
function b64encode(str){ const b = new TextEncoder().encode(str); let out = ""; for (let i = 0; i < b.length; i += 0x8000) out += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(out); }
function b64decode(b64){ const x = atob(String(b64).replace(/\s/g, "")); const b = new Uint8Array(x.length); for (let i = 0; i < x.length; i++) b[i] = x.charCodeAt(i); return new TextDecoder().decode(b); }
async function httpErr(r){
  let m = ""; try{ m = (await r.json()).message || ""; }catch(e){}
  const e = new Error(
    r.status === 401 ? "GitHub-nøkkelen er ugyldig eller utløpt. Lås opp på nytt med en ny nøkkel." :
    r.status === 403 && /rate limit/i.test(m) ? "GitHub har midlertidig sperret for mange forespørsler. Prøv igjen om litt." :
    r.status === 403 ? `Nøkkelen mangler skrivetilgang. Den må ha «Contents: Read and write» for ${GH.repo}.` :
    r.status === 404 ? `Nøkkelen har ikke tilgang til repoet ${GH.repo}.` : `GitHub svarte ${r.status}${m ? ": " + m : ""}`);
  e.status = r.status; e.auth = r.status === 401; e.msg = m;
  return e;
}
/* Henter data: { data, sha } – data er null hvis filen ikke finnes ennå */
async function fetchRemote(){
  let r;
  try{ r = await fetch(`${API}/contents/${GH.path}?ref=${GH.branch}`, { headers: ghHeaders(), cache: "no-store" }); }catch(e){ r = null; }
  if (r && r.status === 404 && !canEdit()) r = null;              // prøv også Pages-kopien
  if (r && r.status === 404) return { data: null, sha: null, missing: true };
  if (r && r.status === 401 && canEdit()) throw await httpErr(r);
  if (r && r.ok){ const j = await r.json(); return { data: validate(JSON.parse(b64decode(j.content))), sha: j.sha }; }
  // reserve: filen slik GitHub Pages serverer den (kan være noen minutter gammel)
  const p = await fetch(`./${GH.path}?t=${Date.now()}`, { cache: "no-store" });
  if (p.status === 404) return { data: null, sha: null, missing: true };
  if (!p.ok) throw new Error("Fikk ikke hentet middagsplanen (" + p.status + ").");
  return { data: validate(await p.json()), sha: null, fromPages: true };
}
async function load(){
  const cached = readCache();
  if (cached){ db = cached; loadState = "ok"; }
  refresh();
  try{
    const rem = await fetchRemote();
    if (canEdit() && sync.dirty && cached){
      // endringer på denne enheten ble ikke lastet opp sist
      if (rem.missing || !rem.sha || rem.sha === sync.sha){ loadState = "ok"; refresh(); save(); runImport(); return; }
      const mine = await confirmBox("Ulagrede endringer", "Denne enheten har endringer som ikke ble lagret, og planen på nettet er endret siden. Vil du beholde endringene fra denne enheten?", "Behold mine", false, "Bruk den på nettet");
      if (mine){ sync.sha = rem.sha; saveSync(); loadState = "ok"; refresh(); save(); runImport(); return; }
    }
    if (rem.fromPages && canEdit() && cached){
      // GitHub-API svarte ikke: ikke la den (kanskje eldre) Pages-kopien overskrive lagret kopi
      toast("Fikk ikke kontakt med GitHub – viser lagret kopi");
      loadState = "ok"; refresh(); runImport(); return;
    }
    if (rem.data) db = rem.data; else if (!cached) db = seed();
    if (rem.sha) sync.sha = rem.sha;
    sync.dirty = false; saveSync(); writeCache(); loadState = "ok";
    if (canEdit() && rem.missing) save();                          // første lagring lager filen
  }catch(e){
    if (e.auth){ lockOut(e.message); return load(); }
    if (loadState === "ok") toast("Viser lagret kopi – fikk ikke kontakt med GitHub");
    else { db = seed(); loadState = "ok"; toast("Fikk ikke kontakt med GitHub – viser standardrettene"); }
  }
  refresh();
  runImport();
}

/* Lagrer på enheten straks, og til GitHub litt etter siste endring (så mange klikk blir én lagring) */
const SAVE_DELAY = 60000;
let pushT = null, pushing = false, pushAgain = false;
function save(){
  writeCache();
  if (!canEdit()) return;
  changeNo++; sync.dirty = true; saveSync(); if (!pushing) setSync("pending");
  clearTimeout(pushT); pushT = setTimeout(pushNow, SAVE_DELAY);
}
async function pushNow(){
  clearTimeout(pushT);
  if (!canEdit() || !sync.dirty) return;
  if (pushing){ pushAgain = true; return; }
  pushing = true; setSync("saving");
  const n = changeNo;
  try{
    if (!sync.sha){
      const g = await fetch(`${API}/contents/${GH.path}?ref=${GH.branch}`, { headers: ghHeaders(), cache: "no-store" });
      if (g.ok) sync.sha = (await g.json()).sha; else if (g.status !== 404) throw await httpErr(g);
    }
    const body = { message: `Oppdater middagsplan (${APP_NAME} ${APP_VERSION})`, content: b64encode(fileText(db)), branch: GH.branch };
    if (sync.sha) body.sha = sync.sha;
    const r = await fetch(`${API}/contents/${GH.path}`, { method: "PUT", headers: { ...ghHeaders(), "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok){
      const e = await httpErr(r);
      if (r.status === 409 || (r.status === 422 && /sha/i.test(e.msg))) { await conflict(); return; }
      throw e;
    }
    sync.sha = (await r.json()).content.sha;
    if (changeNo === n) sync.dirty = false; else pushAgain = true;
    saveSync(); setSync(sync.dirty ? "saving" : "ok");
  }catch(e){
    if (e.auth) lockOut(e.message);
    else setSync("error", e.message || "Ingen kontakt med GitHub");
  }finally{
    pushing = false;
    if (pushAgain){ pushAgain = false; if (sync.dirty && canEdit()) pushNow(); }
  }
}
/* GitHub har en nyere versjon enn den denne enheten bygde på */
async function conflict(){
  let rem;
  try{ rem = await fetchRemote(); }catch(e){ setSync("error", e.message); return; }
  const mine = await confirmBox("Planen er endret et annet sted", "Det er lagret en nyere versjon fra en annen enhet. Vil du overskrive den med det du har her?", "Overskriv", false, "Bruk den nyeste");
  sync.sha = rem.sha;
  if (mine) { saveSync(); pushAgain = true; return; }
  if (rem.data) db = rem.data;
  sync.dirty = false; saveSync(); writeCache(); setSync("ok"); refresh();
}
function setSync(state, msg = ""){ syncState = state; syncMsg = msg; drawLock(); }

/* ---------- lås ---------- */
function lockHtml(){
  const st = !canEdit() ? "" :
    syncState === "error" ? `<button class="sync err" data-act="retrySync" title="${esc(syncMsg)}">⚠️ <span class="lbl">Ikke lagret – </span>prøv igjen</button>` :
    syncState === "pending" ? '<button class="savebtn" data-act="saveNow" title="Lagres automatisk etter 1 minutt uten endringer">💾 <span class="lbl">Lagre nå</span></button>' :
    syncState === "saving" ? '<span class="sync">Lagrer…</span>' : syncState === "ok" ? '<span class="sync ok">✓<span class="lbl"> Lagret</span></span>' : "";
  return st + ` <button class="lockbtn${canEdit() ? " on" : ""}" data-act="lock" aria-label="${canEdit() ? "Redigering er på. Trykk for å låse" : "Lås opp redigering"}">${canEdit() ? "🔓<span class=\"lbl\"> Redigerer</span>" : "🔒<span class=\"lbl\"> Lås opp</span>"}</button>`;
}
function drawLock(){
  document.body.classList.toggle("ro", !canEdit());
  const el = $("#lockTop"); if (el) el.innerHTML = lockHtml();
}
function lockOut(msg){ token = ""; ls.del(TOKEN_KEY); clearTimeout(pushT); syncState = ""; toast(msg || "🔒 Redigering er låst"); drawLock(); refresh(); }
async function verifyToken(t){
  let r;
  try{ r = await fetch(API, { headers: ghHeaders(t), cache: "no-store" }); }catch(e){ throw new Error("Fikk ikke kontakt med GitHub. Sjekk nettet."); }
  if (!r.ok) throw await httpErr(r);
  const j = await r.json();
  if (j.permissions && j.permissions.push === false) throw new Error("Brukeren bak nøkkelen har ikke skrivetilgang til repoet.");
}
function unlockForm(){
  openModal(`<button class="mclose" data-close aria-label="Lukk">✕</button><h2>🔒 Lås opp redigering</h2>
    <p class="muted">Alle kan se middagsplanen. For å endre den trenger du en GitHub-nøkkel med skrivetilgang til repoet. Nøkkelen lagres bare på denne enheten.</p>
    <ol class="steps">
      <li>Åpne <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub → ny fine-grained token</a></li>
      <li>Repository access: <b>Only select repositories</b> → <b>${esc(GH.repo)}</b></li>
      <li>Permissions → Repository permissions → <b>Contents: Read and write</b></li>
      <li>Trykk <b>Generate token</b>, kopier og lim inn her</li>
    </ol>
    <form class="form" id="tf" novalidate><div class="field full"><label for="tok">GitHub-nøkkel</label>
      <input id="tok" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…" autofocus></div></form>
    <p class="muted" id="tokMsg" role="alert" style="min-height:1.4em;margin:8px 0 0"></p>
    <div class="acts"><button class="btn" data-close>Avbryt</button><button class="btn pri" form="tf" type="submit" id="tokBtn">Lås opp</button></div>`,
  (m, close) => {
    const msg = $("#tokMsg", m), btn = $("#tokBtn", m);
    $("#tf", m).onsubmit = async e => {
      e.preventDefault();
      const t = $("#tok", m).value.trim();
      if (!t) { msg.textContent = "Lim inn nøkkelen først."; return; }
      btn.disabled = true; msg.style.color = ""; msg.textContent = "Sjekker nøkkelen…";
      try{
        await verifyToken(t);
        token = t; ls.set(TOKEN_KEY, t); close(); drawLock();
        toast("🔓 Redigering er slått på for denne enheten");
        await afterUnlock();
      }catch(err){ msg.style.color = "var(--danger)"; msg.textContent = err.message; btn.disabled = false; }
    };
  });
}
async function afterUnlock(){
  let rem;
  try{ rem = await fetchRemote(); }catch(e){ if (e.auth) return lockOut(e.message); toast(e.message); return; }
  sync.sha = rem.sha; sync.dirty = false; saveSync();
  if (rem.data) db = rem.data;
  writeCache(); refresh();
  if (rem.missing) save(); else setSync("ok");
  runImport();
}

/* ---------- oppslag ---------- */
const recipeById = id => id ? db.recipes.find(r => r.id === id) : undefined;
/* planlagt middag, med oppdaterte verdier fra retten hvis den finnes */
function entryView(e){
  if (!e) return null;
  const r = recipeById(e.recipeId);
  return r ? { ...e, name: r.name, category: r.category, time: r.time, recipe: r } : { ...e, recipe: null };
}
const isKos = e => e.category === "Helgekos" || e.category === "Grill" || (e.time || 0) > 45;
function usesOf(id){ return Object.keys(db.plan).filter(k => db.plan[k].recipeId === id && k <= todayStr()).sort(); }
function setPlan(ds, r, persons){
  db.plan[ds] = { recipeId: r.id, name: r.name, category: r.category, time: r.time, persons: persons === 4 ? 4 : 3 };
}
function setPlanText(ds, text, persons){

}

/* ---------- smarte forslag ----------
   Hverdager: rask mat (≤ 30 min) får plusspoeng, lang tid og helgekos minus.
   Helg: helgekos, grill og retter som tar tid får plusspoeng.
   Aldri samme rett dagen før eller etter. Helst ikke samme rett to ganger i uka.
   Maks én fiskemiddag per uke. Grill mest i sesong (mai–sep). Nylig brukte retter trekkes ned. */
function candidates(ds, getId, exclude = ""){
  const d = parseYmd(ds), wd = weekdayIdx(d), weekend = wd >= 5;
  const prevId = getId(ymd(addDays(d, -1))), nextId = getId(ymd(addDays(d, 1)));
  const mon = mondayOf(d), monStr = ymd(mon);
  const weekIds = weekDates(mon).filter(x => x !== ds).map(getId).filter(Boolean);
  const fishInWeek = weekIds.some(id => (recipeById(id) || {}).category === "Fisk");
  const prevCat = (recipeById(prevId) || {}).category;
  const from = ymd(addDays(mon, -28));
  const recent = {};
  for (const [k, e] of Object.entries(db.plan)) if (k >= from && k < monStr && e.recipeId) recent[e.recipeId] = (recent[e.recipeId] || 0) + 1;
  const m = d.getMonth();
  const grillSeason = m >= 4 && m <= 8;
  const out = [];
  for (const r of db.recipes){
    if (r.id === prevId || r.id === nextId || r.id === exclude) continue;
    let s = 0;
    if (!weekend){
      if (r.time <= FAST) s += 4; else if (r.time > 45) s -= 4;
      if (r.category === "Helgekos") s -= 3;
    } else {
      if (r.category === "Helgekos") s += 4;
      if (r.category === "Grill") s += 2;
      if (r.time >= 40) s += 2; else if (r.time <= 20) s -= 1;
    }
    if (r.category === "Grill" && !grillSeason) s -= 3;
    if (r.favorite) s += 1.5;
    if (r.category === "Fisk") s -= 1;
    if (r.category === "Fisk" && fishInWeek) s -= 10;
    if (weekIds.includes(r.id)) s -= 8;
    if (prevCat && prevCat === r.category) s -= 1.5;
    s -= 2 * (recent[r.id] || 0);
    out.push({ r, s });
  }
  return out.sort((a, b) => b.s - a.s);
}
/* trekker blant de beste, så forslagene varierer */
function pickFor(ds, getId, exclude){
  const list = candidates(ds, getId, exclude).slice(0, 5).map(x => ({ ...x, j: x.s + Math.random() * 2.5 }));
  list.sort((a, b) => b.j - a.j);
  return list[0] ? list[0].r : null;
}
const planGetId = ds => (db.plan[ds] || {}).recipeId || "";

/* ---------- handleliste ---------- */
const FAM = u => (u === "g" || u === "kg") ? "g" : (u === "dl" || u === "l") ? "dl" : u;
const toBase = (q, u) => u === "kg" ? q * 1000 : u === "l" ? q * 10 : q;
function fmtQty(q, u){
  if (!q) return "";
  if (u === "g") return q >= 1000 ? num(Math.round(q / 100) / 10) + " kg" : num(q < 100 ? Math.ceil(q / 5 - 1e-9) * 5 : Math.ceil(q / 10 - 1e-9) * 10) + " g";
  if (u === "dl") return q >= 10 ? num(Math.round(q) / 10) + " l" : num(Math.ceil(q * 2 - 1e-9) / 2) + " dl";
  if (["ss", "ts", "fedd"].includes(u)) return num(Math.max(0.5, Math.ceil(q * 2 - 1e-9) / 2)) + " " + u;
  return num(Math.max(1, Math.ceil(q - 1e-9))) + " " + u;   // stk, pk, pose, boks … kjøpes hele
}
function buildShop(days){
  const map = new Map();
  for (const ds of days){
    const e = db.plan[ds]; if (!e) continue;
    const r = recipeById(e.recipeId); if (!r) continue;
    const f = (e.persons || 3) / (r.servings || 4);
    for (const g of r.ingredients){
      const fam = FAM(g.unit), key = g.name.toLowerCase() + "|" + fam;
      let it = map.get(key);
      if (!it){ it = { key, name: g.name, unit: fam, qty: 0, section: g.section, from: [] }; map.set(key, it); }
      it.qty += toBase(g.qty, g.unit) * f;
      if (!it.from.includes(r.name)) it.from.push(r.name);
    }
  }
  return [...map.values()];
}
function shopState(){ try{ return JSON.parse(ls.get(SHOP_KEY) || "{}") || {}; }catch(e){ return {}; } }
function saveShopState(s){
  const keys = Object.keys(s).sort();
  while (keys.length > 10) delete s[keys.shift()];   // husk bare de siste ukene
  ls.set(SHOP_KEY, JSON.stringify(s));
}
function shopFor(wk){ const s = shopState(); return s[wk] || { c: [], off: [] }; }
function setShopFor(wk, v){ const s = shopState(); s[wk] = v; saveShopState(s); }

function viewWeek(){
  const t = todayStr();
  const days = weekDates(weekStart).map((ds, i) => {
    const e = entryView(db.plan[ds]);
    const d = parseYmd(ds);
    const cls = ["day", i >= 5 ? "weekend" : "", ds === t ? "today" : "", ds < t ? "past" : ""].join(" ");
    let body;
    if (e){
      body = `<button class="meal" data-act="openDay" data-date="${ds}">
          <span class="mi" style="--c:${catColor(e.category)}">${e.recipe ? catIcon(e.category) : "📝"}</span>
          <span class="mt"><b>${esc(e.name)}</b>
          ${e.recipe ? `<span class="tag"><span class="dot" style="--c:${catColor(e.category)}"></span>${esc(e.category)} · ${e.time} min</span>` : '<span class="tag">Uten oppskrift</span>'}</span>
        </button>
        <footer>
          <button class="pp${e.persons === 4 ? " four" : ""}" data-act="persons" data-date="${ds}" title="Antall personer" ${canEdit() ? "" : "disabled"}>👤 ${e.persons}</button>
          <span class="sp"></span>
          <button class="mini eo" data-act="reroll" data-date="${ds}" title="Nytt forslag" aria-label="Nytt forslag">🎲</button>
          <button class="mini eo" data-act="clearDay" data-date="${ds}" title="Fjern" aria-label="Fjern middag">✕</button>
        </footer>`;
    } else {
      body = canEdit()
        ? `<button class="add" data-act="openDay" data-date="${ds}">＋ Legg til middag</button>`
        : '<div class="noplan">Ikke planlagt</div>';
    }
    return `<article class="${cls}">
      <header><span class="dn">${DAY_NAMES[i]}</span>${ds === t ? '<span class="now">I dag</span>' : `<span class="dd">${fmtShort(d)}</span>`}</header>
      ${body}</article>`;
  }).join("");
  const dates = weekDates(weekStart);
  const planned = dates.filter(ds => db.plan[ds]);
  const fast = dates.slice(0, 5).filter(ds => { const e = entryView(db.plan[ds]); return e && e.recipe && e.time <= FAST; }).length;

function dayForm(ds){
  const d = parseYmd(ds), wd = weekdayIdx(d);

  let persons = cur ? cur.persons : db.settings.persons;
  const getId = x => x === ds ? "" : planGetId(x);
  const scored = candidates(ds, getId);
  const score = new Map(scored.map(x => [x.r.id, x.s]));
  const sugg = scored.slice(0, 3).map(x => x.r);
  let q = "";
  openModal(`<button class="mclose" data-close aria-label="Lukk">✕</button>
    <h2>${DAY_NAMES[wd]} ${fmtShort(d)}</h2>

    ${sugg.length ? `<div class="sugg">${sugg.map(r => `<button data-pick="${r.id}">${catIcon(r.category)} ${esc(r.name)}<small>${r.time} min · ${esc(r.category)}</small></button>`).join("")}</div>` : ""}

    <div class="lbl-row"><b>Noe annet?</b></div>

    <div class="acts">${cur ? '<button class="btn danger grow" id="rm">Fjern middag</button>' : ""}<button class="btn" data-close>Lukk</button></div>`,

    const drawList = () => {

      const list = db.recipes.filter(r => !s || r.name.toLowerCase().includes(s) || r.category.toLowerCase().includes(s))
        .sort((a, b) => (score.has(b.id) ? score.get(b.id) : -99) - (score.has(a.id) ? score.get(a.id) : -99) || a.name.localeCompare(b.name, "no"));
      $("#pl", m).innerHTML = list.map(r => {
        const off = !score.has(r.id);
        return `<button class="pick${cur && cur.recipeId === r.id ? " cur" : ""}${off ? " off" : ""}" data-pick="${r.id}">
          <span class="ricon" style="--c:${catColor(r.category)}">${catIcon(r.category)}</span>
          <span class="pb"><b>${esc(r.name)}${r.favorite ? " ★" : ""}</b><small>${r.time} min · ${esc(r.category)}${off ? " · samme som dagen før/etter" : ""}</small></span>
          ${r.time <= FAST ? '<span class="pill fast">Rask</span>' : ""}</button>`;
      }).join("") || '<p class="muted">Ingen treff.</p>';
    };
    drawList();
    $("#dq", m).oninput = e => { q = e.target.value; drawList(); };
    m.addEventListener("click", e => {
      const b = e.target.closest("[data-pick]"); if (!b) return;
      const r = recipeById(b.dataset.pick); if (!r) return;
      setPlan(ds, r, persons); save(); close(); refresh();
      toast(`${catIcon(r.category)} ${r.name} på ${DAY_NAMES[wd].toLowerCase()}`);
    });
    $("#ftf", m).onsubmit = e => {
      e.preventDefault();
      const t = $("#ft", m).value.trim(); if (!t) return;
      setPlanText(ds, t, persons); save(); close(); refresh();
    };

    if (rm) rm.onclick = () => { close(); clearDay(ds); };
  });
}
function clearDay(ds){
  const old = db.plan[ds]; if (!old) return;
  delete db.plan[ds]; save(); refresh();
  toast(`Fjernet ${old.name}`, () => { db.plan[ds] = old; save(); refresh(); });
}
function reroll(ds){
  const cur = db.plan[ds];
  const getId = x => x === ds ? "" : planGetId(x);
  const r = pickFor(ds, getId, cur ? cur.recipeId : "");
  if (!r) return toast("Fant ingen andre retter som passer");
  setPlan(ds, r, cur ? cur.persons : db.settings.persons); save(); refresh();
  toast(`🎲 ${r.name}`, () => { if (cur) db.plan[ds] = cur; else delete db.plan[ds]; save(); refresh(); });
}
function proposeForm(){
  const dates = weekDates(weekStart);
  let overwrite = false;
  let map = {};
  const getId = ds => (ds in map) ? map[ds] : planGetId(ds);
  const build = () => {
    map = {};
    for (const ds of dates){
      if (!overwrite && db.plan[ds]) continue;
      map[ds] = "";
      const r = pickFor(ds, getId);
      map[ds] = r ? r.id : "";
    }
  };
  const rerollOne = ds => { const old = map[ds]; map[ds] = ""; const r = pickFor(ds, getId, old); map[ds] = r ? r.id : old; };
  build();
  openModal(`<button class="mclose" data-close aria-label="Lukk">✕</button>
    <h2>✨ Foreslå ukemeny</h2>
    <p class="muted" style="margin:0">Uke ${isoWeek(weekStart).week}. Raske retter på hverdager, kosemat i helgen, ingen rett to dager på rad. Trykk 🎲 for å bytte en dag.</p>
    <label class="check" style="margin-top:12px"><input type="checkbox" id="ow"> Erstatt også dager som allerede er planlagt</label>
    <div class="prop" id="prop"></div>
    <div class="acts"><button class="btn grow" id="again">🔄 Nytt forslag</button><button class="btn" data-close>Avbryt</button><button class="btn pri" id="ok">Bruk forslaget</button></div>`,
  (m, close) => {
    const draw = () => {
      $("#prop", m).innerHTML = dates.map((ds, i) => {
        const d = parseYmd(ds);
        if (!(ds in map)){
          const e = entryView(db.plan[ds]);
          return `<div class="prop-row keep"><span class="pd">${DAY_SHORT[i]}<small>${fmtShort(d)}</small></span><span class="pn"><b>${esc(e.name)}</b><small>Beholdes</small></span></div>`;
        }
        const r = recipeById(map[ds]);
        return `<div class="prop-row"><span class="pd">${DAY_SHORT[i]}<small>${fmtShort(d)}</small></span>
          <span class="ricon" style="--c:${catColor(r ? r.category : "")};width:36px;height:36px;font-size:1.1rem">${r ? catIcon(r.category) : "–"}</span>
          <span class="pn"><b>${r ? esc(r.name) : "Ingen forslag"}</b><small>${r ? `${r.time} min · ${esc(r.category)}` : ""}</small></span>
          <button class="mini" data-roll="${ds}" aria-label="Bytt forslag for ${DAY_NAMES[i]}">🎲</button></div>`;
      }).join("");
    };
    draw();
    $("#ow", m).onchange = e => { overwrite = e.target.checked; build(); draw(); };
    $("#again", m).onclick = () => { build(); draw(); };
    $("#prop", m).onclick = e => { const b = e.target.closest("[data-roll]"); if (!b) return; rerollOne(b.dataset.roll); draw(); };
    $("#ok", m).onclick = () => {
      const before = JSON.parse(JSON.stringify(db.plan));
      let n = 0;
      for (const [ds, id] of Object.entries(map)){
        const r = recipeById(id); if (!r) continue;
        setPlan(ds, r, db.plan[ds] ? db.plan[ds].persons : db.settings.persons); n++;
      }
      save(); close(); refresh();
      toast(`✨ ${n} middager lagt inn`, () => { db.plan = before; save(); refresh(); });
    };
  });
}

function matches(r, q){
  if (!q) return true;
  const s = q.toLowerCase();
  return r.name.toLowerCase().includes(s) || r.desc.toLowerCase().includes(s) || r.category.toLowerCase().includes(s) || r.ingredients.some(g => g.name.toLowerCase().includes(s));
}
function drawGrid(){
  const fav = view === "favoritter";
  const f = fav ? ff : rf;
  let list = db.recipes.filter(r => (!fav || r.favorite) && (fav || !f.fav || r.favorite) && (!f.cat || r.category === f.cat) && matches(r, f.q));
  const used = id => usesOf(id).length;
  const sort = fav ? "navn" : f.sort;
  list.sort(sort === "tid" ? (a, b) => a.time - b.time : sort === "brukt" ? (a, b) => used(b.id) - used(a.id) || a.name.localeCompare(b.name, "no") : (a, b) => a.name.localeCompare(b.name, "no"));
  const sel = $("#sort"); if (sel) sel.value = f.sort;
  $("#cnt").textContent = `${list.length} ${list.length === 1 ? "rett" : "retter"}`;
  $("#grid").innerHTML = list.map(r => {
    const n = used(r.id);
    return `<div class="rc" data-id="${r.id}">
      <button class="rcmain" data-act="recipe" data-id="${r.id}">
      <span class="ricon" style="--c:${catColor(r.category)}">${catIcon(r.category)}</span>
      <span class="rb"><b>${esc(r.name)}</b><span class="rd">${esc(r.desc) || "&nbsp;"}</span>
        <span class="meta"><span class="pill${r.time <= FAST ? " fast" : ""}">⏱ ${r.time} min</span><span class="tag"><span class="dot" style="--c:${catColor(r.category)}"></span>${esc(r.category)}</span>${n ? `<span class="tag">· ${n}× brukt</span>` : ""}</span></span>
      </button>
      <button class="star${r.favorite ? " on" : ""}" data-act="fav" data-id="${r.id}" aria-label="${r.favorite ? "Fjern fra favoritter" : "Legg til favoritter"}" ${canEdit() ? "" : "disabled"}>${r.favorite ? "★" : "☆"}</button>
    </div>`;
  }).join("") || `<div class="empty" style="grid-column:1/-1"><b>${fav ? "★" : "🔍"}</b>${fav && !db.recipes.some(r => r.favorite) ? "Ingen favoritter ennå. Trykk ☆ på en rett for å markere den." : "Ingen retter passer søket."}</div>`;
}

        servings: $("#fs", m).value, favorite: $("#ffav", m).checked, url: $("#fu", m).value, ingredients });
      if (r){
        Object.assign(r, data);
        for (const e2 of Object.values(db.plan)) if (e2.recipeId === r.id){ e2.name = r.name; e2.category = r.category; e2.time = r.time; }
      } else db.recipes.push(data);
      save(); close(); refresh();
      toast(r ? `Lagret ${data.name}` : `${catIcon(data.category)} ${data.name} er lagt til`);
    };
  }, "wide");
}

/* ---------- import fra nettsider ----------
   Bokmerket («bookmarklet») kjører på oppskriftssiden og leser oppskriften i schema.org-format
   (som de fleste store oppskriftssider har for Google). Den sendes hit i adressen: #/import/<json>.
   Adressen etter # sendes aldri til noen server. Her tolkes ingrediensene og skjemaet fylles ut. */
const UNIT_ALIAS = {
  g: ["g"], gr: ["g"], gram: ["g"], kg: ["kg"], kilo: ["kg"],
  dl: ["dl"], l: ["l"], liter: ["l"], ml: ["dl", 0.01], cl: ["dl", 0.1],
  ss: ["ss"], spiseskje: ["ss"], spiseskjeer: ["ss"], ts: ["ts"], teskje: ["ts"], teskjeer: ["ts"],
  stk: ["stk"], stykk: ["stk"], stykker: ["stk"],
  pk: ["pk"], pakke: ["pk"], pakker: ["pk"], pakning: ["pk"], pakninger: ["pk"],
  pose: ["pose"], poser: ["pose"], boks: ["boks"], bokser: ["boks"], glass: ["glass"], beger: ["beger"],
  fedd: ["fedd"], båt: ["fedd"], båter: ["fedd"], skive: ["skive"], skiver: ["skive"], bunt: ["bunt"], bunter: ["bunt"],
  terning: ["stk"], terninger: ["stk"],
  klype: ["", 0], klyper: ["", 0], dryss: ["", 0], neve: ["stk"], never: ["stk"],
};
const FRAC = { "½": .5, "¼": .25, "¾": .75, "⅓": 1 / 3, "⅔": 2 / 3, "⅛": .125 };
const SEC_RULES = [
  ["Frys", /\b(frossen|frosne|fryst|frosset)/],
  ["Hermetikk og saus", /kraft\\b|fond\\b|hakkede tomater|knuste tomater|tomatpur|tomatsaus|kokosmelk|bønner|kikerter|saus\b|saus$|ketchup|sennep|majones|soya|pesto|salsa|dressing|syltetøy|currypaste|hermetisk|\bmais\b/],
  ["Krydder", /\bsalt\b|pepper\b|krydder|pulver|karri|spisskummen|kanel|oregano|timian|rosmarin|buljong|chiliflak|laurbær|muskat|kardemomme|nellik/],
  ["Brød og bakst", /brød|lefse|tortilla|pita|lompe|rundstykk|nanbrød|\bnan\b|baguette|loff|wraps?\b|ciabatta/],
  ["Tørrvarer", /mel\b|\bris\b|pasta|spaghetti|makaroni|nudler|sukker|havregryn|linser|bulgur|couscous|olje|eddik|nøtter|mandler|panko|griljermel|maisenna|bakepulver|natron|lasagneplater|tacoskjell|nachochips|honning/],
  ["Kjøtt og fisk", /kjøtt|deig|kylling|biff|filet|svin|bacon|skinke|pølse|laks|torsk|\bsei\b|fisk|reke|kotelett|lår|entrecote|\blam|karbonade|chorizo|salami|kalkun|ørret|makrell|hyse|kveite|skrei|tunfisk|kjøttkak|medisterkak|ribbe|nakke/],
  ["Meieri og egg", /melk|fløte|rømme|\bost\b|ost$|smør|\begg\b|egg$|eggeplom|yoghurt|crème|creme|kesam|parmesan|mozzarella|cheddar|feta|kremost|gjær|kulturmelk/],
  ["Frukt og grønt", /\\bfrisk|\\bfersk|estragon|mynte|salvie|kerve|rucola|fennikel|rosenkål|grønnkål|pære|plomme|appelsin|mandarin|ananas|melon|kiwi|fersken|druer|nektarin|løk|potet|gulrot|tomat|agurk|salat|paprika|brokkoli|blomkål|squash|sopp|sjampinjong|purre|sitron|lime|avokado|spinat|kål|chili|ingefær|persille|koriander|basilikum|gressløk|dill|selleri|eple|banan|bær|erter|asparges|aubergine|bønnespirer|reddik|rødbet|kålrot|søtpotet|mango|pasjon|urter|ruccola|sukkererter|kjerne/],
];
const htmlText = s => { const d = new DOMParser().parseFromString(String(s ?? ""), "text/html"); return (d.body.textContent || "").replace(/\s+/g, " ").trim(); };
const hostOf = u => { try{ return new URL(u).hostname.replace(/^www\./, ""); }catch(e){ return "nettsiden"; } };
function isoMinutes(v){
  const m = String(v || "").match(/^P(?:(\d+)D)?(?:T(?:(\d+(?:\.\d+)?)H)?(?:(\d+(?:\.\d+)?)M)?(?:\d+(?:\.\d+)?S)?)?$/i);
  if (!m) return 0;
  return Math.round((+m[1] || 0) * 1440 + (+m[2] || 0) * 60 + (+m[3] || 0));
}
function yieldNum(v){
  const m = [].concat(v || []).join(" ").match(/\d+/);
  return m ? clampInt(+m[0], 1, 20, 4) : 4;
}
function readNum(str){
  const s = str.trim();
  if (FRAC[s]) return FRAC[s];
  let m = s.match(/^(\d+)\s*([½¼¾⅓⅔⅛])$/); if (m) return +m[1] + FRAC[m[2]];
  m = s.match(/^(\d+)\s+(\d+)\/(\d+)$/); if (m) return +m[1] + m[2] / m[3];
  m = s.match(/^(\d+)\/(\d+)$/); if (m) return m[1] / m[2];
  return parseNum(s);
}
function guessSection(name, known){
  const n = name.toLowerCase();
  if (known && known.has(n)) return known.get(n).section;
  for (const [sec, re] of SEC_RULES.slice(0, 3)) if (re.test(n)) return sec;   // frys, hermetikk, krydder går foran
  if (known){
    let best = null;   // lengste kjente navn som står i navnet, f.eks. «kjøttdeig» i «kjøttdeig av storfe»
    for (const [k, g] of known) if (k.length > 2 && hasWord(n, k) && (!best || k.length > best[0].length)) best = [k, g];
    if (best) return best[1].section;
  }
  for (const [sec, re] of SEC_RULES) if (re.test(n)) return sec;
  return "Annet";
}
/* «2 ss olivenolje», «400g kjøttdeig», «1 1/2 dl fløte», «2–3 fedd hvitløk, finhakket», «Salt og pepper» */
const hasWord = (text, w) => {
  const i = text.indexOf(w);
  if (i < 0) return false;
  const L = /[a-zæøåéèü0-9]/i;
  for (let j = i; j >= 0; j = text.indexOf(w, j + 1)){
    if ((j === 0 || !L.test(text[j - 1])) && (j + w.length >= text.length || !L.test(text[j + w.length]))) return true;
  }
  return false;
};
function parseIngLine(line, known){
  let s = htmlText(line).replace(/^[-•*·]\s*/, "").replace(/^(ca\.?|cirka|omtrent|ev\.?|evt\.?)\s+/i, "");
  if (!s) return null;
  const NUM = "(?:\\d+\\s+\\d+\\/\\d+|\\d+\\/\\d+|\\d+\\s*[½¼¾⅓⅔⅛]|[½¼¾⅓⅔⅛]|\\d+(?:[.,]\\d+)?)";
  const m = s.match(new RegExp(`^(${NUM})(?:(?:\\s*[-–]\\s*|\\s+(?:til|eller)\\s+)(${NUM}))?\\s*(.*)$`));
  let qty = 0, unit = "stk", rest = s;
  if (m && m[3] !== undefined){
    qty = readNum(m[2] || m[1]);   // spenn som «2–3»: kjøp det største
    rest = m[3];
    const mx = rest.match(new RegExp(`^[x×]\\s*(${NUM})\\s*(.*)$`, "i"));   // «2 x 400 g»
    if (mx){ qty *= readNum(mx[1]); rest = mx[2]; }
    const w = rest.match(/^([a-zæøå]+)\.?(?:\s+|$)(.*)$/i);
    const a = w && UNIT_ALIAS[w[1].toLowerCase()];
    if (a){
      rest = w[2];
      if (a[0] === ""){ qty = 0; unit = "stk"; }
      else { unit = a[0]; if (a.length > 1) qty *= a[1]; }
    }
  }
  let name = rest.replace(/\([^)]*\)/g, " ").replace(/^(av|med)\s+/i, "").replace(/\s+/g, " ").trim();
  if (qty && name.includes(",")) name = name.split(",")[0].trim();   // «løk, finhakket» → «løk»
  name = name.replace(/[.,;:]+$/, "");
  if (!name) return null;
  if (!/^[A-ZÆØÅ]{2}/.test(name)) name = name.charAt(0).toLowerCase() + name.slice(1);
  return { qty: +qty.toFixed(3), unit, name: name.slice(0, 80), section: guessSection(name, known) };
}
function guessCategory(name, tags, ingText){
  const t = (name + " " + tags).toLowerCase(), all = t + " " + ingText.toLowerCase();
  const FISH = /laks|torsk|\bsei\b|fisk|reke|ørret|makrell|sjømat|hyse|kveite|skrei|tunfisk|scampi/;
  const CHICKEN = /kylling|høne|kalkun/;
  const MEAT = /kjøtt|biff|svin|deig|bacon|pølse|\blam|storfe|karbonade|skinke|entrecote|filet|kotelett|ribbe|nakke|chorizo|kjøttkak/;
  if (/suppe/.test(t)) return "Suppe";
  if (/grill/.test(t)) return "Grill";
  if (/vegetar|vegansk|vegan\b|plantebasert/.test(t)) return "Vegetar";
  if (FISH.test(name.toLowerCase())) return "Fisk";
  if (CHICKEN.test(name.toLowerCase())) return "Kylling";
  if (CHICKEN.test(all)) return "Kylling";
  if (FISH.test(all)) return "Fisk";
  if (MEAT.test(all)) return "Kjøtt";
  return "Hverdagsmiddag";
}
/* data fra bokmerket → forslag til rett (lagres ikke før du trykker Lagre) */
function recipeFromImport(d){
  const known = new Map();
  for (const x of db.recipes) for (const g of x.ingredients) if (!known.has(g.name.toLowerCase())) known.set(g.name.toLowerCase(), g);
  const lines = [].concat(d.ings || []).map(String);
  const ingredients = lines.map(l => parseIngLine(l, known)).filter(Boolean);
  const name = htmlText(d.name).slice(0, 80);
  const time = isoMinutes(d.time) || (isoMinutes(d.prep) + isoMinutes(d.cook)) || 30;
  return {
    name, desc: htmlText(d.desc).slice(0, 300), time: clampInt(time, 1, 1440, 30),
    category: guessCategory(name, htmlText(d.cat), ingredients.map(g => g.name).join(" ")),
    servings: yieldNum(d.yield), favorite: false,
    url: /^https?:\/\//i.test(String(d.url || "")) ? String(d.url).slice(0, 500) : "",
    ingredients, skipped: lines.length - ingredients.length,
  };
}
let pendingImport = null;
function takeImportFromHash(){
  const m = location.hash.match(/^#\/?import\/(.+)$/);
  if (!m) return false;
  try{
    const d = JSON.parse(decodeURIComponent(m[1]));
    if (!d || typeof d !== "object" || !String(d.name || "").trim()) throw new Error("mangler navn");
    pendingImport = d;
  }catch(e){ setTimeout(() => toast("Klarte ikke å lese oppskriften fra bokmerket"), 0); }
  view = "oppskrifter";
  history.replaceState(null, "", location.pathname + location.search + "#/oppskrifter");
  return true;
}
function runImport(){
  if (!pendingImport || loadState !== "ok" || !db.recipes) return;
  if (!canEdit()){ toast("Lås opp redigering for å lagre oppskriften"); unlockForm(); return; }
  const d = pendingImport; pendingImport = null;
  const pre = recipeFromImport(d);
  const same = db.recipes.find(r => (pre.url && r.url === pre.url) || r.name.toLowerCase() === pre.name.toLowerCase());
  if (same){ toast(`«${same.name}» finnes allerede`); recipeDetail(same.id); return; }
  recipeForm(null, pre);
}
/* koden som ligger i bokmerket. Kjører på oppskriftssiden, ikke her. */
function bookmarkletCode(appUrl){
  const code = `(()=>{const A=${JSON.stringify(appUrl)};let R=null;const f=o=>{if(!o||typeof o!=="object"||R)return;if(Array.isArray(o)){o.forEach(f);return}const t=[].concat(o["@type"]||[]);if(t.includes("Recipe")){R=o;return}f(o["@graph"]);f(o.mainEntity);f(o.mainEntityOfPage)};document.querySelectorAll('script[type="application/ld+json"]').forEach(s=>{try{f(JSON.parse(s.textContent))}catch(e){}});if(!R){alert("Fant ingen oppskrift på denne siden.\\n\\nMiddags panikk leser oppskrifter i schema.org-format, som de fleste store oppskriftssider bruker. Åpne selve oppskriften og prøv igjen.");return}const x=v=>Array.isArray(v)?v.map(x).filter(Boolean).join(", "):v&&typeof v==="object"?String(v.name||v.text||""):String(v==null?"":v);const d={v:1,name:x(R.name),desc:x(R.description).slice(0,400),time:x(R.totalTime),prep:x(R.prepTime),cook:x(R.cookTime),yield:x(R.recipeYield),ings:[].concat(R.recipeIngredient||R.ingredients||[]).map(x).filter(Boolean),cat:[R.recipeCategory,R.recipeCuisine,R.keywords].map(x).join(", ").slice(0,300),url:location.href.split("#")[0]};const u=A+"#/import/"+encodeURIComponent(JSON.stringify(d));if(!window.open(u,"_blank"))location.href=u})()`;
  return "javascript:" + encodeURIComponent(code);
}
